name: QA regression (one-off, test data only)
on:
  push:
    branches: [claude/sweet-knuth-u4nbzm]
    paths: ['e2e/qa-regress.mjs', 'e2e/qa-core.mjs', '.github/workflows/qa-regress.yml']
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-package-lock playwright@1.48.2
        working-directory: e2e
      - run: export ANON=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"') && cd e2e && node qa-regress.mjs
        env:
          CHANNEL: chrome

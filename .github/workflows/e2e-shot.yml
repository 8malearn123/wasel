name: Screenshot check

on:
  push:
    branches: [claude/sweet-knuth-u4nbzm-device-dialog, claude/sweet-knuth-u4nbzm-pos-fullwidth]
    paths: ['src/**', 'e2e/shot.mjs', '.github/workflows/e2e-shot.yml']

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run build
      - run: (npx vite preview --port 4173 --strictPort > preview.log 2>&1 &) && sleep 5
      - run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
        working-directory: e2e
      - working-directory: e2e
        env:
          SITE: http://localhost:4173
          # Public anon key (already committed in .env)
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlud2RkeXh6eXBiY2Z0bGV2dWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MjE1OTQsImV4cCI6MjA4NTQ5NzU5NH0.PsNDqovuzo7NmTiwsH4swskkIF3FdMlBXjYUy3MJkyA
        run: node shot.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: e2e/shot-*.png

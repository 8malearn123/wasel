name: Employee check

on:
  push:
    branches: [claude/sweet-knuth-u4nbzm-employee-check]
    paths: ['e2e/employee-actions.mjs', '.github/workflows/employee-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMAIL: demo-cashier@wasil.demo
      PROFILE: cashier-max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: actions
        working-directory: e2e
        env:
          # Public anon key (already committed in .env)
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlud2RkeXh6eXBiY2Z0bGV2dWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MjE1OTQsImV4cCI6MjA4NTQ5NzU5NH0.PsNDqovuzo7NmTiwsH4swskkIF3FdMlBXjYUy3MJkyA
        run: node employee-actions.mjs
      - run: npm ci && npm run build
        if: always()
      - run: (npx vite preview --port 4173 --strictPort > preview.log 2>&1 &) && sleep 5
        if: always()
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-package-lock playwright@1.48.2
        if: always()
        working-directory: e2e
        timeout-minutes: 5
      - name: screens
        if: always()
        working-directory: e2e
        env:
          SITE: http://localhost:4173
          CHANNEL: chrome
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlud2RkeXh6eXBiY2Z0bGV2dWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MjE1OTQsImV4cCI6MjA4NTQ5NzU5NH0.PsNDqovuzo7NmTiwsH4swskkIF3FdMlBXjYUy3MJkyA
        run: node roles.mjs

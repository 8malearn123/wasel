name: Audit live (read only)
on:
  push:
    branches: [claude/sweet-knuth-u4nbzm]
    paths: ['e2e/audit-live.mjs', '.github/workflows/audit-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-package-lock playwright@1.48.2
        working-directory: e2e
      - run: export ANON=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"') && cd e2e && node audit-live.mjs
        env:
          CHANNEL: chrome

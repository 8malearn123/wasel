name: QA fixes (one-off, test data only)
on:
  push:
    branches: [claude/fix-qa-findings]
    paths: ['e2e/qa-fix.mjs', 'e2e/qa-core.mjs', '.github/workflows/qa-fix.yml', 'src/**']
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: (npx vite preview --port 4173 --strictPort > preview.log 2>&1 &) && npx --yes wait-on http://localhost:4173 -t 60000
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-package-lock playwright@1.48.2
        working-directory: e2e
      - run: export ANON=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"') && cd e2e && node qa-fix.mjs
        env:
          CHANNEL: chrome
          SITE: http://localhost:4173

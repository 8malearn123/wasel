name: Test custom roles with the demo cashier

# Read-only checks against the live project, signed in as the demo cashier
# (login code 70035 on the sign-in page). Nothing here writes data: the only
# write attempts are ones a cashier must be refused.
on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-knuth-u4nbzm-custom-roles]
    paths: ['.github/workflows/test-cashier-roles.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cashier 70035 — role, permissions, and what it is refused
        env:
          SUPA: https://ynwddyxzypbcftlevuam.supabase.co
          # Public anon key (already committed in .env) — RLS still applies
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlud2RkeXh6eXBiY2Z0bGV2dWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MjE1OTQsImV4cCI6MjA4NTQ5NzU5NH0.PsNDqovuzo7NmTiwsH4swskkIF3FdMlBXjYUy3MJkyA
        shell: bash
        run: |
          set -uo pipefail
          SESSION=$(curl -sS "$SUPA/functions/v1/login-by-code" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" -d '{"code":"70035"}')
          TOKEN=$(echo "$SESSION" | jq -r '.session.access_token // empty')
          [ -n "$TOKEN" ] || { echo "login failed: $SESSION"; exit 1; }
          UID_=$(echo "$SESSION" | jq -r '.session.user.id')
          H=(-H "apikey: $ANON" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")

          echo "== membership (role on merchant_users)"
          curl -sS "$SUPA/rest/v1/merchant_users?select=id,role,is_active,merchant_id&user_id=eq.$UID_" "${H[@]}" | jq -c .

          echo "== my_permissions()"
          curl -sS -X POST "$SUPA/rest/v1/rpc/my_permissions" "${H[@]}" -d '{}' | jq -c .

          echo "== has_permission(roles.manage) / (users.update)"
          curl -sS -X POST "$SUPA/rest/v1/rpc/has_permission" "${H[@]}" -d '{"_permission":"roles.manage"}'; echo
          curl -sS -X POST "$SUPA/rest/v1/rpc/has_permission" "${H[@]}" -d '{"_permission":"users.update"}'; echo

          echo "== which of the repo's migrations the live database has"
          for T in login_code_attempts product_media roles permissions user_roles employees; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$SUPA/rest/v1/$T?select=*&limit=0" "${H[@]}")
            echo "table $T: HTTP $CODE"
          done
          for F in get_subscription_state merchant_subscription_active login_code_recent_failures check_category_cycle can_supply_wholesale can_buy_wholesale has_permission save_custom_role; do
            R=$(curl -sS -X POST "$SUPA/rest/v1/rpc/$F" "${H[@]}" -d '{}')
            if echo "$R" | grep -q PGRST202; then echo "rpc $F: MISSING"; else echo "rpc $F: present"; fi
          done
          echo "merchant_categories.parent_id: $(curl -sS -o /dev/null -w '%{http_code}' "$SUPA/rest/v1/merchant_categories?select=parent_id&limit=0" "${H[@]}")"
          echo "plans names:"; curl -sS "$SUPA/rest/v1/plans?select=name,name_ar" "${H[@]}"; echo

          echo "== roles visible to the cashier"
          curl -sS "$SUPA/rest/v1/roles?select=key,name_ar,is_system,merchant_id" "${H[@]}"; echo

          echo "== is the custom-roles migration live? (save_custom_role must refuse a cashier)"
          curl -sS -X POST "$SUPA/rest/v1/rpc/save_custom_role" "${H[@]}" \
            -d '{"_role_id":null,"_name":"probe","_description":null,"_permissions":["reports.view"]}'; echo

          echo "== assign_member_role on itself (must refuse a cashier)"
          MID=$(curl -sS "$SUPA/rest/v1/merchant_users?select=id&user_id=eq.$UID_" "${H[@]}" | jq -r '.[0].id')
          curl -sS -X POST "$SUPA/rest/v1/rpc/assign_member_role" "${H[@]}" \
            -d "{\"_member_id\":\"$MID\",\"_role\":\"admin\"}"; echo

          echo "== rows the cashier reads today (unchanged by the migration for system roles)"
          for T in sales daily_closings repair_orders customers campaigns suppliers; do
            N=$(curl -sS -I "$SUPA/rest/v1/$T?select=id" "${H[@]}" -H "Prefer: count=exact" -H "Range: 0-0" | grep -i content-range | tr -d '\r' | awk -F/ '{print $2}')
            echo "$T: ${N:-?}"
          done

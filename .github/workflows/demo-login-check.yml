name: Demo login check

on:
  push:
    branches: [claude/sweet-knuth-u4nbzm-demo-check]
    paths: ['src/**', 'e2e/demo-login-check.mjs', '.github/workflows/demo-login-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run build
      - run: (npx vite preview --port 4173 --strictPort > preview.log 2>&1 &) && sleep 5
      - run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
        working-directory: e2e
        timeout-minutes: 5
      - working-directory: e2e
        env:
          SITE: http://localhost:4173
        run: node demo-login-check.mjs

name: QA live (one-off, test data only)
on:
  push:
    branches: [claude/sweet-knuth-u4nbzm]
    paths: ['e2e/qa-live.mjs', 'e2e/qa-core.mjs', '.github/workflows/qa-live.yml']
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-package-lock playwright@1.48.2
        working-directory: e2e
      - run: export ANON=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"') && cd e2e && node qa-live.mjs
        env:
          CHANNEL: chrome
          ONLY: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-live
          path: |
            e2e/shots/
            e2e/results.json
            e2e/matrices.json
          retention-days: 7

name: Storefront data check (one-off, read-only)
on:
  push:
    branches: [claude/sweet-knuth-u4nbzm]
    paths: ['.github/workflows/storecheck.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          K=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"')
          U=https://ynwddyxzypbcftlevuam.supabase.co
          A="-H apikey:$K -H Authorization:Bearer\ $K"
          g() { curl -s "$U/rest/v1/$1" -H "apikey: $K" -H "Authorization: Bearer $2" -H "Prefer: count=exact" -D - -o /tmp/b | grep -i content-range | tr -d '\r'; head -c 300 /tmp/b; echo; }
          echo "R|stores|$(curl -s "$U/rest/v1/store_settings?select=slug,merchant_id&is_published=eq.true" -H "apikey: $K" -H "Authorization: Bearer $K")"
          for m in $(curl -s "$U/rest/v1/store_settings?select=merchant_id&is_published=eq.true" -H "apikey: $K" -H "Authorization: Bearer $K" | python3 -c 'import sys,json;print(" ".join(r["merchant_id"] for r in json.load(sys.stdin)))'); do
            echo "R|anon-devices|$m|$(g "public_store_devices?select=id&merchant_id=eq.$m&limit=1" $K)"
            echo "R|anon-accessories|$m|$(g "public_store_accessories?select=id&merchant_id=eq.$m&limit=1" $K)"
          done
          T=$(curl -s "$U/auth/v1/token?grant_type=password" -H "apikey: $K" -H "content-type: application/json" -d '{"email":"demo-distributor@wasil.demo","password":"demo1234"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          M=$(curl -s "$U/rest/v1/merchant_users?select=merchant_id&limit=1" -H "apikey: $K" -H "Authorization: Bearer $T" | python3 -c 'import sys,json;print(json.load(sys.stdin)[0]["merchant_id"])')
          echo "R|owner-merchant|$M"
          echo "R|owner-store|$(curl -s "$U/rest/v1/store_settings?select=slug,is_published&merchant_id=eq.$M" -H "apikey: $K" -H "Authorization: Bearer $T")"
          echo "R|owner-available-devices|$(g "devices?select=id&merchant_id=eq.$M&status=eq.available&limit=1" $T)"
          echo "R|owner-view-devices|$(g "public_store_devices?select=id&merchant_id=eq.$M&limit=1" $T)"
          echo "R|anon-view-devices-owner-shop|$(g "public_store_devices?select=id&merchant_id=eq.$M&limit=1" $K)"
          echo "R|anon-devices-table-owner-shop|$(g "devices?select=id&merchant_id=eq.$M&status=eq.available&limit=1" $K)"

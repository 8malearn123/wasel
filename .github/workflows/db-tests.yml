name: Database tests

# Applies every migration to a throwaway Postgres and runs supabase/tests/db
# (data fixes, pos_checkout, web orders, reservations, concurrency).
on:
  pull_request:
    paths:
      - "supabase/**"
      - "vitest.db.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/db-tests.yml"
  push:
    paths:
      - "supabase/**"
      - "vitest.db.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/db-tests.yml"
  workflow_dispatch:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

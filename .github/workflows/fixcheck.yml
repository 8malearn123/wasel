name: Live check of the fix branch (one-off, read-only)
on:
  push:
    branches: [claude/sweet-knuth-u4nbzm]
    paths: ['e2e/fixcheck.mjs', '.github/workflows/fixcheck.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: claude/fix-qa-findings, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: app
      - run: (npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &) && sleep 5 && curl -sf http://localhost:4173/ > /dev/null && echo preview-up
        working-directory: app
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-package-lock playwright@1.48.2
        working-directory: e2e
      - run: export ANON=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"') && cd e2e && node fixcheck.mjs

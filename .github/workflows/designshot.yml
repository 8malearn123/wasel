name: Design refresh screenshots (one-off, read-only)
on:
  push:
    branches: [claude/sweet-knuth-u4nbzm]
    paths: ['e2e/designshot.mjs', '.github/workflows/designshot.yml']
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: claude/design-refresh, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: app
      - run: (npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &) && sleep 5 && curl -sf http://localhost:4173/ > /dev/null && echo preview-up
        working-directory: app
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-package-lock playwright@1.48.2
        working-directory: e2e
      - run: node designshot.mjs
        working-directory: e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: e2e/shot-*.png

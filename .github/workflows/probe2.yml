name: Read-only probe 2 (one-off)
on:
  push:
    branches: [claude/sweet-knuth-u4nbzm]
    paths: ['e2e/probe2.mjs']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: export ANON=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"') && node e2e/probe2.mjs

name: Restore demo store colors

on:
  workflow_dispatch:
  # Undoes apply-store-brand (#54/#55). Runs once when this file lands on
  # main, since the repository's default branch is not main.
  push:
    branches: [main]
    paths: ['.github/workflows/restore-store-colors.yml']

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Put store colours back to what they were before the PIXA change
        env:
          SUPA: https://ynwddyxzypbcftlevuam.supabase.co
          # Public anon key (already committed in .env) — RLS still applies
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlud2RkeXh6eXBiY2Z0bGV2dWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MjE1OTQsImV4cCI6MjA4NTQ5NzU5NH0.PsNDqovuzo7NmTiwsH4swskkIF3FdMlBXjYUy3MJkyA
        run: |
          set -euo pipefail

          # Only the two colour columns change. The demo-account stores were
          # seeded by seed-store.yml with teal/gold; the cashier-code store was
          # never seeded, so it gets the table's column defaults back.
          SEEDED='{"primary_color": "#0f766e", "secondary_color": "#f59e0b"}'
          DEFAULTS='{"primary_color": "#6366f1", "secondary_color": "#8b5cf6"}'

          apply_merchant() {
            local TOKEN="$1" LABEL="$2" BODY="$3"
            local MID
            MID=$(curl -sS "$SUPA/rest/v1/merchant_users?select=merchant_id&is_active=eq.true&limit=1" \
              -H "apikey: $ANON" -H "Authorization: Bearer $TOKEN" | jq -r '.[0].merchant_id // empty')
            [ -n "$MID" ] || { echo "[$LABEL] no merchant"; return 0; }
            local RESP
            RESP=$(curl -sS -X PATCH "$SUPA/rest/v1/store_settings?merchant_id=eq.$MID" \
              -H "apikey: $ANON" -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" -H "Prefer: return=representation" \
              --data "$BODY")
            echo "[$LABEL] $(echo "$RESP" | jq -c 'map({slug, primary_color, secondary_color})' 2>/dev/null || echo "$RESP")"
          }

          FAILED=0

          SESSION=$(curl -sS "$SUPA/functions/v1/login-by-code" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" -d '{"code":"70035"}')
          TOKEN=$(echo "$SESSION" | jq -r '.session.access_token // empty')
          if [ -n "$TOKEN" ]; then apply_merchant "$TOKEN" "cashier-70035" "$DEFAULTS" || FAILED=1; else echo "[cashier-70035] login failed"; fi

          for EMAIL in demo-basic@wasil.demo demo-professional@wasil.demo demo-enterprise@wasil.demo demo-distributor@wasil.demo; do
            AUTH=$(curl -sS "$SUPA/auth/v1/token?grant_type=password" \
              -H "apikey: $ANON" -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"password\":\"demo1234\"}")
            TOKEN=$(echo "$AUTH" | jq -r '.access_token // empty')
            if [ -n "$TOKEN" ]; then apply_merchant "$TOKEN" "$EMAIL" "$SEEDED" || FAILED=1; else echo "[$EMAIL] login failed"; FAILED=1; fi
          done

          echo "== published stores now =="
          curl -sS "$SUPA/rest/v1/store_settings?select=slug,primary_color,secondary_color&is_published=eq.true" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" | jq -c '.[]'

          exit $FAILED
